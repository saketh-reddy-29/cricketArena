name: Cricket Arena validation

on:
  push:
    branches:
      - main
      - feat/cricket-arena-brand-franchise-lifecycle
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build production bundle
        run: npm run build
      - name: Run IPL roster and franchise lifecycle tests
        run: npm test -- src/tests/ipl2027RosterAndLifecycle.test.ts --reporter=dot
